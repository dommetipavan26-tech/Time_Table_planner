<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Winter Planner — course and timetable planner for the Winter 2026-27 semester">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81" />
      <stop offset="0.5" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" />
  <circle cx="1030" cy="20" r="260" fill="url(#glow)" />
  <circle cx="120" cy="300" r="220" fill="url(#glow)" opacity="0.7" />

  <!-- app mark -->
  <rect x="72" y="104" width="92" height="92" rx="24" fill="url(#mark)" stroke="#ffffff" stroke-opacity="0.35" />
  <path d="M95 132 L108 168 L118 147 L128 168 L141 132"
        fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" />

  <text x="196" y="152" font-family="Outfit, Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Winter Planner</text>
  <text x="198" y="192" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" fill="#ffffff" fill-opacity="0.78">Course &amp; timetable planner · Winter 2026–27</text>

  <!-- feature chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.92">
    <rect x="198" y="214" width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.28" />
    <text x="282" y="239" text-anchor="middle">Classes Tue–Sat</text>

    <rect x="378" y="214" width="196" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.28" />
    <text x="476" y="239" text-anchor="middle">1 theory + 1 lab</text>

    <rect x="586" y="214" width="216" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.28" />
    <text x="694" y="239" text-anchor="middle">Conflict-checked</text>
  </g>
</svg>
