name: Validate catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Data, README, links and meta tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit pinned developer dependencies
        run: npm audit --audit-level=high

      # Catalogue and checker use no production dependencies or build step.
      - name: Run the catalogue validator
        run: node tools/validate-data.mjs

      # Pure planner logic: slot mapping, conflict detection and storage failures.
      - name: Run planner unit tests
        run: node --test tools/planner-core.test.mjs

      # Broken links, unlabelled controls, dead app.js bindings, JSON-LD.
      - name: Run the link and control checker
        run: node tools/check-links.mjs
